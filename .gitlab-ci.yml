
stages:
  - test
  - quality

install_job:
  stage: test
  image: node:20-alpine
  script: 
    - npm test

sonarqube_scan:
  stage: quality
  image: 
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]

  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  
    GIT_DEPTH: "0" 
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/ 
  script: 
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  
